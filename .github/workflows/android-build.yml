name: Android CI Build

on:
  push:
    branches: ["main", "master", "release/*"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Guardian
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Verify Firebase configuration
        run: test -s app/google-services.json

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests and Detekt
        run: ./gradlew test detekt

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: greggory-portal-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Detekt report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: greggory-portal-detekt-report
          path: app/build/reports/detekt/
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Verify release configuration
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must use the vMAJOR.MINOR.PATCH format."
            exit 1
          fi
          for name in RELEASE_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Required Actions secret $name is not configured."
              exit 1
            fi
          done
          test -s app/google-services.json

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks
          test -s app/release-key.jks

      - name: Build signed release APK and bundle
        run: ./gradlew bundleRelease assembleRelease
        env:
          KEYSTORE_PATH: release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare release assets and version manifest
        id: release-assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp app/build/outputs/apk/release/app-release.apk release-assets/GSSF-client-portal.apk
          cp app/build/outputs/bundle/release/app-release.aab release-assets/GSSF-client-portal.aab

          version_code="$(git rev-list --count HEAD)"
          version_name="$GITHUB_REF_NAME"
          apk_sha256="$(sha256sum release-assets/GSSF-client-portal.apk | cut -d ' ' -f 1)"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/GSSF-client-portal.apk"

          previous_tag="$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            release_range="${previous_tag}..${GITHUB_SHA}"
          else
            release_range="$GITHUB_SHA"
          fi
          mapfile -t features < <(git log "$release_range" --no-merges --format=%s -- . ':!docs/version.json' | sed '/^[[:space:]]*$/d' | head -n 8)
          if (( ${#features[@]} == 0 )); then
            features=("Maintenance and reliability improvements")
          fi
          features_json="$(printf '%s\n' "${features[@]}" | jq -R . | jq -s .)"

          jq -n \
            --argjson versionCode "$version_code" \
            --arg versionName "$version_name" \
            --arg url "$download_url" \
            --arg sha256 "$apk_sha256" \
            --argjson features "$features_json" \
            '{versionCode: $versionCode, versionName: $versionName, url: $url, sha256: $sha256, features: $features}' \
            > release-assets/version.json

          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "apk_sha256=$apk_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload release APK, bundle, and manifest
        uses: softprops/action-gh-release@v2
        with:
          name: GSSF Client Portal ${{ steps.release-assets.outputs.version_name }}
          files: |
            release-assets/GSSF-client-portal.apk
            release-assets/GSSF-client-portal.aab
            release-assets/version.json
          overwrite_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update the legacy app updater manifest on main
        uses: actions/checkout@v4
        with:
          ref: main
          path: portal-main
          fetch-depth: 0

      - name: Verify release is based on main and update manifest
        env:
          VERSION_CODE: ${{ steps.release-assets.outputs.version_code }}
          VERSION_NAME: ${{ steps.release-assets.outputs.version_name }}
        run: |
          set -euo pipefail
          git -C portal-main merge-base --is-ancestor "$GITHUB_SHA" "$(git -C portal-main rev-parse HEAD)" || {
            echo "::error::Refusing to publish a release tag that is not on main."
            exit 1
          }

          current_manifest="portal-main/docs/version.json"
          if [[ -f "$current_manifest" ]]; then
            current_code="$(jq -r '.versionCode // 0' "$current_manifest")"
            current_name="$(jq -r '.versionName // ""' "$current_manifest")"
            if [[ "$current_code" =~ ^[0-9]+$ ]] && (( current_code > VERSION_CODE )); then
              echo "::error::Refusing to replace a newer published version code."
              exit 1
            fi
            current_numeric="${current_name#v}"
            release_numeric="${VERSION_NAME#v}"
            if [[ -n "$current_name" ]] && [[ "$(printf '%s\n' "$current_numeric" "$release_numeric" | sort -V | tail -n 1)" != "$release_numeric" ]]; then
              echo "::error::Refusing to replace a newer published version name."
              exit 1
            fi
          fi

          cp release-assets/version.json "$current_manifest"
          sed -i "s|href=\"GSSF-client-portal.apk\"|href=\"https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/GSSF-client-portal.apk\"|" portal-main/docs/index.html
          git -C portal-main rm --ignore-unmatch docs/GSSF-client-portal.apk
          git -C portal-main config user.name "github-actions[bot]"
          git -C portal-main config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C portal-main add docs/version.json docs/index.html
          if ! git -C portal-main diff --cached --quiet; then
            git -C portal-main commit -m "chore: publish Android ${VERSION_NAME} update manifest"
            git -C portal-main push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload updated website
        uses: actions/upload-pages-artifact@v3
        with:
          path: portal-main/docs

      - name: Deploy updated website
        id: pages-deployment
        uses: actions/deploy-pages@v4

      - name: Remove temporary signing keystore
        if: always()
        run: rm -f app/release-key.jks
