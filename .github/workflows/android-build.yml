name: Android CI Build

on:
  push:
    branches: [ "main", "master", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Detekt Code Quality Analysis
      run: ./gradlew detekt

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v3
      with:
        name: greggory-portal-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Detekt Report
      uses: actions/upload-artifact@v3
      with:
        name: greggory-portal-detekt-report
        path: app/build/reports/detekt/
        if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Decode Keystore
      run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release-key.jks
    - name: Build Release Bundle
      run: ./gradlew bundleRelease
      env:
        KEYSTORE_PATH: release-key.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    - name: Upload Release Bundle
      uses: actions/upload-artifact@v3
      with:
        name: greggory-portal-release
        path: app/build/outputs/bundle/release/app-release.aab
