name: Android CI Build

on:
  push:
    branches: [ "main", "master", "release/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Gitleaks Secret Guardian
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Decode Google Services JSON
      run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Run Detekt Code Quality Analysis
      run: ./gradlew detekt

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: greggory-portal-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload Detekt Report
      uses: actions/upload-artifact@v4
      with:
        name: greggory-portal-detekt-report
        path: app/build/reports/detekt/
        if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    - name: Decode Google Services JSON
      run: echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > app/google-services.json
    - name: Decode Keystore
      run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 --decode > app/release-key.jks
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build Release Bundle & APK
      run: ./gradlew bundleRelease assembleRelease
      env:
        KEYSTORE_PATH: release-key.jks
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    - name: Upload Release Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: greggory-portal-release
        path: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/release/*.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/release/*.apk
        draft: true
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
