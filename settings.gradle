plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

if (System.getProperty('os.name').toLowerCase().contains('windows')) {
    def tempPath = "C:/android-temp"
    new File(tempPath).mkdirs()
    System.setProperty('java.io.tmpdir', tempPath)
    System.setProperty('TEMP', tempPath)
    System.setProperty('TMP', tempPath)
    try {
        def env = System.getenv()
        def field = env.getClass().getDeclaredField("m")
        field.setAccessible(true)
        ((Map) field.get(env)).put("TEMP", tempPath)
        ((Map) field.get(env)).put("TMP", tempPath)
    } catch (Exception ignored) {}
}

rootProject.name = "The Greggory Client Portal"
include ':app'
